<script>
// === 种子演示用户 ===
(function(){
    var users = JSON.parse(localStorage.getItem("xiaoweimm_users")||"{}");
    if(!users["13800000000"]){
        users["13800000000"] = {phone:"13800000000",name:"管理员",role:"admin",time:"2026-05-01"};
        users["13800138001"] = {phone:"13800138001",name:"张卖家",role:"seller",time:"2026-05-01"};
        users["13800138002"] = {phone:"13800138002",name:"李买家",role:"buyer",time:"2026-05-02"};
        localStorage.setItem("xiaoweimm_users", JSON.stringify(users));
    }
})();

function isValidPhone(phone){ return /^1[3-9]\d{9}$/.test(phone); }

// === 开发模式验证码 ===
var currentDevCode = "";
function generateDevCode(){ currentDevCode = String(Math.floor(100000 + Math.random() * 900000)); return currentDevCode; }

// === 弹窗控制 ===
var overlay = document.getElementById("modalOverlay");
var btnLogin = document.getElementById("btnLogin");
var modalClose = document.getElementById("modalClose");

btnLogin.addEventListener("click", function(){ overlay.classList.add("show"); });
if(modalClose) modalClose.addEventListener("click", function(){ overlay.classList.remove("show"); });
overlay.addEventListener("click", function(e){ if(e.target === overlay) overlay.classList.remove("show"); });

// === Tab 切换 ===
var tabLogin = document.getElementById("tabLogin");
var tabReg = document.getElementById("tabReg");
var loginForm = document.getElementById("loginForm");
var regForm = document.getElementById("regForm");
var toRegister = document.getElementById("toRegister");
var toLogin = document.getElementById("toLogin");

function switchTab(toLoginTab){
    if(toLoginTab){
        tabLogin.classList.add("active"); tabReg.classList.remove("active");
        loginForm.classList.add("active"); regForm.classList.remove("active");
    } else {
        tabReg.classList.add("active"); tabLogin.classList.remove("active");
        regForm.classList.add("active"); loginForm.classList.remove("active");
    }
}
tabLogin.addEventListener("click", function(){ switchTab(true); });
tabReg.addEventListener("click", function(){ switchTab(false); });
if(toRegister) toRegister.addEventListener("click", function(){ switchTab(false); });
if(toLogin) toLogin.addEventListener("click", function(){ switchTab(true); });

// === 短信倒计时 ===
function startCountdown(btn){
    var sec = 60;
    btn.disabled = true;
    btn.textContent = sec + "秒后重发";
    var timer = setInterval(function(){
        sec--;
        btn.textContent = sec + "秒后重发";
        if(sec <= 0){
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = "获取验证码";
        }
    }, 1000);
}

// === 登录 - 获取验证码 ===
document.getElementById("loginSmsBtn").addEventListener("click", function(){
    var phone = document.getElementById("loginPhone").value.trim();
    if(!isValidPhone(phone)){ alert("请输入有效的手机号"); return; }
    startCountdown(document.getElementById("loginSmsBtn")); generateDevCode();
    alert("验证码已发送至 " + phone + "（开发模式验证码：" + currentDevCode + "）");
});

// === 注册 - 获取验证码 ===
document.getElementById("regSmsBtn").addEventListener("click", function(){
    var phone = document.getElementById("regPhone").value.trim();
    if(!isValidPhone(phone)){ alert("请输入有效的手机号"); return; }
    startCountdown(document.getElementById("regSmsBtn")); generateDevCode();
    alert("验证码已发送至 " + phone + "（开发模式验证码：" + currentDevCode + "）");
});

// === 更新导航栏状态 ===
function updateNavUser(phone){
    document.getElementById("btnLogin").style.display = "none";
    document.getElementById("userGreeting").style.display = "flex";
    document.getElementById("userAvatar").textContent = phone.slice(-2);
    document.getElementById("userPhone").textContent = phone.slice(0,3) + "****" + phone.slice(-4);
    var v = JSON.parse(sessionStorage.getItem("xiaoweimm_verify")||"null");
    var badgeWarn = document.getElementById("verifyBadgeWarn");
    var badgeOk = document.getElementById("verifyBadgeOk");
    if(v && v.status === "approved"){
        if(badgeWarn) badgeWarn.style.display = "none";
        if(badgeOk) badgeOk.style.display = "inline";
    } else if(v && v.status === "pending"){
        if(badgeWarn){ badgeWarn.style.display = "inline"; badgeWarn.textContent = "审核中"; }
        if(badgeOk) badgeOk.style.display = "none";
    } else {
        if(badgeWarn){ badgeWarn.style.display = "inline"; badgeWarn.textContent = "未认证"; }
        if(badgeOk) badgeOk.style.display = "none";
    }
}

// === 登录提交 ===
document.getElementById("loginSubmit").addEventListener("click", function(){
    var phone = document.getElementById("loginPhone").value.trim();
    var code = document.getElementById("loginCode").value.trim();
    if(!isValidPhone(phone)){ alert("请输入有效的手机号"); return; }
    if(code !== currentDevCode || !currentDevCode){ alert("验证码错误，请重新获取"); return; }
    overlay.classList.remove("show");
    var users = JSON.parse(localStorage.getItem("xiaoweimm_users")||"{}");
    var saved = users[phone];
    var role = saved ? saved.role : "";
    sessionStorage.setItem("xiaoweimm_user", JSON.stringify({phone:phone, role:role, name:saved?saved.name:"", time:Date.now()}));
    updateNavUser(phone);
    var target = role === "admin" ? "admin.html" : role === "seller" ? "seller.html" : role === "buyer" ? "buyer.html" : "member.html";
    setTimeout(function(){ window.location.href = target; }, 800);
});

// === 注册提交 ===
document.getElementById("regSubmit").addEventListener("click", function(){
    var phone = document.getElementById("regPhone").value.trim();
    var code = document.getElementById("regCode").value.trim();
    var name = document.getElementById("regName").value.trim();
    var role = document.getElementById("regRole").value;
    var agree = document.getElementById("regAgree").checked;
    if(!isValidPhone(phone)){ alert("手机号为必填项，请输入有效的手机号"); return; }
    if(!code){ alert("请输入短信验证码"); return; }
    if(code !== currentDevCode || !currentDevCode){ alert("验证码错误，请重新获取"); return; }
    if(!agree){ alert("请先同意服务协议和隐私政策"); return; }
    overlay.classList.remove("show");
    var user = {phone:phone, name:name, role:role, time:Date.now()};
    sessionStorage.setItem("xiaoweimm_user", JSON.stringify(user));
    var users = JSON.parse(localStorage.getItem("xiaoweimm_users")||"{}");
    users[phone] = user;
    localStorage.setItem("xiaoweimm_users", JSON.stringify(users));
    updateNavUser(phone);
    var target = role === "seller" ? "seller.html" : role === "buyer" ? "buyer.html" : "verify.html";
    setTimeout(function(){ window.location.href = target; }, 800);
});

// === 退出登录 ===
document.getElementById("btnLogout").addEventListener("click", function(){
    document.getElementById("btnLogin").style.display = "";
    document.getElementById("userGreeting").style.display = "none";
    var bw = document.getElementById("verifyBadgeWarn");
    var bo = document.getElementById("verifyBadgeOk");
    if(bw) bw.style.display = "none";
    if(bo) bo.style.display = "none";
    sessionStorage.removeItem("xiaoweimm_user");
    alert("已退出登录");
});

// === 页面加载时检查登录状态 ===
(function initAuth(){
    var user = JSON.parse(sessionStorage.getItem("xiaoweimm_user")||"null");
    if(user && user.phone){
        updateNavUser(user.phone);
    }
})();

// === 键盘ESC关闭弹窗 ===
document.addEventListener("keydown", function(e){
    if(e.key === "Escape") overlay.classList.remove("show");
});
</script>
