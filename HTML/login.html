<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册｜xiaoweimm</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        button,input,select,textarea,.btn,a.nav-btn,[role="button"],.nav-login,.nav-btn,.menu-icon,.sidebar-toggle{min-height:44px;min-width:44px;touch-action:manipulation;}
body{font-family:"Noto Sans SC","Noto Sans JP",sans-serif;color:#333;line-height:1.7;background:#f7f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        :root{--main:#1a44aa;--light:#f4f6fa;--dark:#151d2b;--gray:#555;}
        a{text-decoration:none;color:inherit;}

        .login-wrapper{width:100%;max-width:440px;padding:20px;}
        .login-header{text-align:center;margin-bottom:28px;}
        .login-header .logo{font-size:30px;font-weight:700;color:var(--main);display:block;}
        .login-header p{font-size:14px;color:var(--gray);margin-top:4px;}

        .login-card{background:#fff;border-radius:12px;padding:36px 32px 28px;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
        .tabs{display:flex;border-bottom:2px solid #ddd;margin-bottom:26px;}
        .tab{flex:1;text-align:center;padding:12px 0;font-size:18px;font-weight:600;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-2px;transition:0.3s;background:none;border-top:none;border-left:none;border-right:none;}
        .tab.active{color:var(--main);border-bottom-color:var(--main);}

        .form-group{margin-bottom:18px;}
        .form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#333;}
        .form-group label .required{color:#e74c3c;}
        .form-group input,.form-group select{width:100%;padding:12px 14px;border:1px solid #bbb;border-radius:6px;font-size:15px;outline:none;transition:border 0.3s;}
        .form-group input:focus,.form-group select:focus{border-color:var(--main);}
        .sms-row{display:flex;gap:10px;}
        .sms-row input{flex:1;}
        .sms-btn{white-space:nowrap;padding:12px 16px;background:var(--main);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;}
        .sms-btn:disabled{background:#ccc;cursor:not-allowed;}

        .submit-btn{width:100%;padding:14px;background:var(--main);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;transition:0.3s;}
        .submit-btn:hover{opacity:0.9;}
        .form-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-bottom:18px;}
        .form-check input{width:auto;}
        .form-check a{color:var(--main);text-decoration:underline;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}

        .extra-links{text-align:center;margin-top:16px;font-size:13px;color:#999;}
        .extra-links a{color:var(--main);cursor:pointer;}

        .back-link{text-align:center;margin-top:20px;font-size:14px;}
        .back-link a{color:var(--gray);}
        .back-link a:hover{color:var(--main);}

        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 28px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
        .toast.show{opacity:1;}
        .toast.success{background:#27ae60;}
        .toast.error{background:#e74c3c;}
        @media(max-width:768px){
            input,select,textarea,button{font-size:16px!important;}
            .login-wrapper{padding:12px;}
            .login-card{padding:24px 16px 20px;border-radius:10px;}
            .login-header .logo{font-size:24px;}
            .tab{font-size:15px;padding:10px 0;}
            .sms-btn{font-size:12px;padding:10px 12px;}
            .submit-btn{padding:12px;font-size:15px;}
        }
    </style>
</head>
<body>
<a href="index.html" style="position:fixed;top:20px;left:20px;font-size:14px;color:var(--main);z-index:100;">&larr; 返回首页</a>

<div class="login-wrapper">
    <div class="login-header">
        <span class="logo">xiaoweimm</span>
        <p>中小企业M&A・企业并购平台</p>
    </div>
    <div class="login-card">
        <div class="tabs">
            <button class="tab active" id="tabLogin">登录</button>
            <button class="tab" id="tabReg">注册</button>
        </div>
        <!-- 登录表单 -->
        <div class="tab-content active" id="loginForm">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="sms-row">
                    <input type="text" id="loginCode" placeholder="短信验证码" maxlength="6">
                    <button class="sms-btn" id="loginSmsBtn" type="button">获取验证码</button>
                </div>
            </div>
            <button class="submit-btn" id="loginSubmit" type="button">登录</button>
            <div class="extra-links"><a id="toRegister">没有账号？立即注册</a></div>
        </div>
        <!-- 注册表单 -->
        <div class="tab-content" id="regForm">
            <div class="form-group">
                <label><span class="required">*</span> 手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号（必填）" maxlength="11" required>
            </div>
            <div class="form-group">
                <label><span class="required">*</span> 验证码</label>
                <div class="sms-row">
                    <input type="text" id="regCode" placeholder="短信验证码" maxlength="6" required>
                    <button class="sms-btn" id="regSmsBtn" type="button">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="regName" placeholder="请输入您的姓名">
            </div>
            <div class="form-group">
                <label>使用角色</label>
                <select id="regRole">
                    <option value="">请选择</option>
                    <option value="seller">我是卖家（希望转让）</option>
                    <option value="buyer">我是买家（希望收购）</option>
                </select>
            </div>
            <div class="form-check">
                <input type="checkbox" id="regAgree" required>
                <label for="regAgree">同意 <a href="javascript:void(0)">服务协议</a> 及 <a href="javascript:void(0)">隐私政策</a></label>
            </div>
            <button class="submit-btn" id="regSubmit" type="button">注册</button>
            <div class="extra-links"><a id="toLogin">已有账号？立即登录</a></div>
        </div>
    </div>
    <div class="back-link"><a href="index.html">&larr; 返回首页</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    var users = JSON.parse(localStorage.getItem("xiaoweimm_users")||"{}");
    if(!users["13800000000"]){
        users["13800000000"] = {phone:"13800000000",name:"管理员",role:"admin",time:"2026-05-01"};
        users["13800138001"] = {phone:"13800138001",name:"张卖家",role:"seller",time:"2026-05-01"};
        users["13800138002"] = {phone:"13800138002",name:"李买家",role:"buyer",time:"2026-05-02"};
        localStorage.setItem("xiaoweimm_users", JSON.stringify(users));
    }
})();

function isValidPhone(phone){ return /^1[3-9]\d{9}$/.test(phone); }
function showToast(message, type){
    var toast = document.getElementById("toast");
    if(!toast){ alert(message); return; }
    toast.textContent = message;
    toast.className = "toast show " + (type || "");
    setTimeout(function(){ toast.className = "toast"; }, 2200);
}
function getTargetAfterAuth(){
    var redirect = sessionStorage.getItem("redirectAfterLogin");
    if(redirect){ sessionStorage.removeItem("redirectAfterLogin"); return redirect; }
    return null;
}
function saveSession(user){
    sessionStorage.setItem("xiaoweimm_user", JSON.stringify(user));
    var users = JSON.parse(localStorage.getItem("xiaoweimm_users")||"{}");
    users[user.phone] = users[user.phone] || {};
    users[user.phone].phone = user.phone;
    users[user.phone].role = user.role || users[user.phone].role || "";
    users[user.phone].name = user.name || users[user.phone].name || "";
    localStorage.setItem("xiaoweimm_users", JSON.stringify(users));
}
function updateNavUser(phone){
    var bL = document.getElementById("btnLogin"); if(bL) bL.style.display = "none";
    var uG = document.getElementById("userGreeting"); if(uG) uG.style.display = "flex";
    var ua = document.getElementById("userAvatar"); if(ua) ua.textContent = phone.slice(-2);
    var up = document.getElementById("userPhone"); if(up) up.textContent = phone.slice(0,3) + "****" + phone.slice(-4);
}
function startCountdown(btn){
    var sec = 60;
    btn.disabled = true;
    btn.textContent = sec + "秒后重发";
    var timer = setInterval(function(){
        sec--;
        if(sec <= 0){
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = "获取验证码";
            return;
        }
        btn.textContent = sec + "秒后重发";
    }, 1000);
}
function bindAuthLogin(){
    var overlay = document.getElementById("modalOverlay");
    var btnLogin = document.getElementById("btnLogin");
    var modalClose = document.getElementById("modalClose");
    var tabLogin = document.getElementById("tabLogin");
    var tabReg = document.getElementById("tabReg");
    var loginForm = document.getElementById("loginForm");
    var regForm = document.getElementById("regForm");
    var toRegister = document.getElementById("toRegister");
    var toLogin = document.getElementById("toLogin");
    var loginSmsBtn = document.getElementById("loginSmsBtn");
    var regSmsBtn = document.getElementById("regSmsBtn");
    var loginSubmit = document.getElementById("loginSubmit");
    var regSubmit = document.getElementById("regSubmit");
    var loginPhone = document.getElementById("loginPhone");
    var loginCode = document.getElementById("loginCode");
    var loginPassword = document.getElementById("loginPassword");
    var regPhone = document.getElementById("regPhone");
    var regCode = document.getElementById("regCode");
    var regName = document.getElementById("regName");
    var regRole = document.getElementById("regRole");
    var regAgree = document.getElementById("regAgree");

    function setTab(showLogin){
        if(showLogin){
            tabLogin.classList.add("active");
            tabReg.classList.remove("active");
            loginForm.classList.add("active");
            regForm.classList.remove("active");
        } else {
            tabReg.classList.add("active");
            tabLogin.classList.remove("active");
            regForm.classList.add("active");
            loginForm.classList.remove("active");
        }
    }

    if(btnLogin) btnLogin.addEventListener("click", function(){ if(overlay) overlay.classList.add("show"); setTab(true); });
    if(modalClose) modalClose.addEventListener("click", function(){ if(overlay) overlay.classList.remove("show"); });
    if(overlay) overlay.addEventListener("click", function(e){ if(e.target === overlay) overlay.classList.remove("show"); });
    if(tabLogin) tabLogin.addEventListener("click", function(){ setTab(true); });
    if(tabReg) tabReg.addEventListener("click", function(){ setTab(false); });
    if(toRegister) toRegister.addEventListener("click", function(){ setTab(false); });
    if(toLogin) toLogin.addEventListener("click", function(){ setTab(true); });

    if(loginSmsBtn) loginSmsBtn.addEventListener("click", function(){
        var phone = loginPhone.value.trim();
        if(!isValidPhone(phone)) return showToast("请输入有效的手机号", "error");
        startCountdown(loginSmsBtn);
        fetch("/api/auth/sms-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: phone })
        }).then(function(r){ return r.json(); }).then(function(d){
            if(d && d.success && d.data && d.data.code){
                loginCode.value = d.data.code;
                showToast("验证码已自动填入（开发模式）", "success");
            } else {
                showToast("发送失败：" + ((d && d.error) || "未知错误"), "error");
            }
        }).catch(function(e){ showToast("网络错误：" + e.message, "error"); });
    });

    if(regSmsBtn) regSmsBtn.addEventListener("click", function(){
        var phone = regPhone.value.trim();
        if(!isValidPhone(phone)) return showToast("请输入有效的手机号", "error");
        startCountdown(regSmsBtn);
        fetch("/api/auth/sms-code", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: phone })
        }).then(function(r){ return r.json(); }).then(function(d){
            if(d && d.success && d.data && d.data.code){
                regCode.value = d.data.code;
                showToast("验证码已自动填入（开发模式）", "success");
            } else {
                showToast("发送失败：" + ((d && d.error) || "未知错误"), "error");
            }
        }).catch(function(e){ showToast("网络错误：" + e.message, "error"); });
    });

    if(loginSubmit) loginSubmit.addEventListener("click", function(){
        var phone = loginPhone.value.trim();
        var password = loginPassword ? loginPassword.value.trim() : "";
        var code = loginCode.value.trim();
        if(!isValidPhone(phone)) return showToast("请输入有效的手机号", "error");
        loginSubmit.disabled = true;
        loginSubmit.textContent = "登录中…";
        var endpoint = password ? "/api/auth/login" : "/api/auth/login-sms";
        var payload = password ? { phone: phone, password: password } : { phone: phone, code: code };
        if(!password && !code){
            showToast("请输入密码，或者填写短信验证码", "error");
            loginSubmit.disabled = false;
            loginSubmit.textContent = "登录";
            return;
        }
        fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(function(r){ return r.json(); }).then(function(d){
            if(d && d.success && d.data && d.data.token){
                saveSession({ phone: d.data.phone, role: d.data.role, name: d.data.name || "", token: d.data.token, time: Date.now() });
                window.location.href = getTargetAfterAuth() || (d.data.role === "admin" ? "admin.html" : d.data.role === "seller" ? "seller.html" : d.data.role === "buyer" ? "buyer.html" : "member.html");
                return;
            }
            showToast("登录失败：" + ((d && d.error) || "未知错误"), "error");
            loginSubmit.disabled = false;
            loginSubmit.textContent = "登录";
        }).catch(function(e){
            showToast("网络错误：" + e.message, "error");
            loginSubmit.disabled = false;
            loginSubmit.textContent = "登录";
        });
    });

    if(regSubmit) regSubmit.addEventListener("click", function(){
        var phone = regPhone.value.trim();
        var code = regCode.value.trim();
        var name = regName.value.trim();
        var role = regRole.value;
        if(!isValidPhone(phone)) return showToast("请输入有效的手机号", "error");
        if(!code) return showToast("请输入短信验证码", "error");
        if(!name) return showToast("请输入姓名", "error");
        if(!role) return showToast("请选择使用角色", "error");
        if(regAgree && !regAgree.checked) return showToast("请先同意服务协议和隐私政策", "error");
        regSubmit.disabled = true;
        regSubmit.textContent = "注册中…";
        fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: phone, code: code, name: name, role: role })
        }).then(function(r){ return r.json(); }).then(function(d){
            if(d && d.success && d.data && d.data.token){
                saveSession({ phone: d.data.phone, role: d.data.role, name: d.data.name || name, token: d.data.token, time: Date.now() });
                window.location.href = getTargetAfterAuth() || (d.data.role === "seller" ? "seller.html" : d.data.role === "buyer" ? "buyer.html" : "verify.html");
                return;
            }
            showToast("注册失败：" + ((d && d.error) || "未知错误"), "error");
            regSubmit.disabled = false;
            regSubmit.textContent = "注册";
        }).catch(function(e){
            showToast("网络错误：" + e.message, "error");
            regSubmit.disabled = false;
            regSubmit.textContent = "注册";
        });
    });

    var btnLogout = document.getElementById("btnLogout");
    if(btnLogout) btnLogout.addEventListener("click", function(){
        sessionStorage.removeItem("xiaoweimm_user");
        var bL = document.getElementById("btnLogin"); if(bL) bL.style.display = "";
        var uG = document.getElementById("userGreeting"); if(uG) uG.style.display = "none";
    });

    var user = JSON.parse(sessionStorage.getItem("xiaoweimm_user")||"null");
    if(user && user.phone) updateNavUser(user.phone);
    if(overlay) document.addEventListener("keydown", function(e){ if(e.key === "Escape") overlay.classList.remove("show"); });
}

bindAuthLogin();
</script>
</body>
</html>
